# LightGCN Production Configuration
# ================================

# Data Configuration
data:
  file_path: 'data/amazon_reviews.csv'
  cache_dir: 'cache'
  min_interactions: 5  # Minimum interactions per user/item

# Model Configuration
model:
  embedding_dim: 32
  num_layers: 3
  dropout: 0.1
  use_attention: true

# Training Configuration
training:
  epochs: 10
  batch_size: 1024
  learning_rate: 0.001
  weight_decay: 0.0001
  early_stopping_patience: 3
  validation_split: 0.1
  test_split: 0.1
  checkpoint_dir: 'checkpoints'
  model_save_path: 'saved_models/lightgcn_model.pth'

# Evaluation Configuration
evaluation:
  top_k_values: [5, 10, 20]
  metrics: ['hit_ratio', 'ndcg', 'precision', 'recall', 'mrr']

# API Configuration
api:
  host: '0.0.0.0'
  port: 8000
  workers: 4
  reload: false
  cors_origins: ['*']
  max_recommendations: 100
  request_timeout: 30

# Logging Configuration
logging:
  level: 'INFO'
  format: '%(asctime)s - %(name)s - %(levelname)s - %(message)s'
  file: 'logs/app.log'
  max_bytes: 10485760  # 10MB
  backup_count: 5

# EDA Configuration
eda:
  output_dir: 'reports'
  plots:
    - 'ratings_distribution'
    - 'user_activity'
    - 'item_popularity'
    - 'interaction_timeline'
